# GitHub release for every version tag the GitLab mirror pushes, created after
# npm shows that version (GitLab CI publishes it). Glama builds and lists a new
# version only from a GitHub release. Scripts come from this checkout (main
# for workflow_dispatch); version and notes come from the tag itself.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag, e.g. v0.5.1"
        required: true

permissions:
  contents: write
  id-token: write # MCP Registry login (GitHub OIDC)

jobs:
  github_release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "no tag $TAG"; exit 1; }
          test "v$(git show "$TAG:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')" = "$TAG"
      - name: wait for npm
        run: |
          for i in $(seq 1 60); do
            if [ "$(npm view "sentinel-ir-mcp@${TAG#v}" version 2>/dev/null)" = "${TAG#v}" ]; then exit 0; fi
            sleep 60
          done
          echo "sentinel-ir-mcp@${TAG#v} is not on npm after 60 min"; exit 1
      - name: create release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          git show "$TAG:README.md" > tag-README.md
          node scripts/release-notes.js "$TAG" tag-README.md > notes.md
          HIGHEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [ "$HIGHEST" = "$TAG" ]; then LATEST=--latest; else LATEST=--latest=false; fi
          gh release create "$TAG" --verify-tag --title "${TAG#v}" --notes-file notes.md "$LATEST"
      # The official MCP Registry gets the tag's server.json once, for the
      # highest tag only (a re-run or an older tag never adds or moves a version).
      - name: publish to the MCP Registry
        env:
          PUBLISHER: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
          PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
        run: |
          HIGHEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [ "$HIGHEST" != "$TAG" ]; then echo "$TAG is not the highest tag ($HIGHEST)"; exit 0; fi
          git show "$TAG:server.json" > tag-server.json
          NAME="$(node -p 'require("./tag-server.json").name')"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${NAME/\//%2F}/versions/${TAG#v}")"
          if [ "$CODE" = 200 ]; then echo "$NAME ${TAG#v} is in the MCP Registry"; exit 0; fi
          curl -sSfL -o mcp-publisher.tar.gz "$PUBLISHER"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish tag-server.json
