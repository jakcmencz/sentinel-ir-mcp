stages:
  - test
  - publish

# Test on every supported Node line (the MCP SDK and sentinel-ir WASM parser).
unit_tests:
  stage: test
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22", "24"]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

# Release: push a protected tag vX.Y.Z matching package.json "version".
# NPM_TOKEN is a masked, protected CI/CD variable; protected tags only.
publish:
  stage: publish
  image: node:24
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/'
  script:
    - npm ci
    - npm test
    - test "v$(node -p 'require("./package.json").version')" = "$CI_COMMIT_TAG"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    # Publish once; a retried job only moves the tag. `setup` writes the
    # stable-<major>.<minor> tag, which npx resolves again on every start.
    - V="${CI_COMMIT_TAG#v}"
    - if [ -z "$(npm view "sentinel-ir-mcp@$V" version 2>/dev/null)" ]; then npm publish --provenance --access public; fi
    # Never move the tag back: a retried older release leaves a newer patch on it.
    - TAG="$(node -p 'require("./src/clients").STABLE_TAG')"
    - CUR="$(npm view "sentinel-ir-mcp@$TAG" version 2>/dev/null || true)"
    - if [ -z "$CUR" ] || node -e 'process.exit(+!require("./src/doctor").olderThan(process.argv[1], process.argv[2]))' "$CUR" "$V"; then npm dist-tag add "sentinel-ir-mcp@$V" "$TAG"; fi
    - NOW="$(npm view "sentinel-ir-mcp@$TAG" version)"
    - echo "$TAG -> $NOW"
    - node -e 'process.exit(+require("./src/doctor").olderThan(process.argv[1], process.argv[2]))' "$NOW" "$V"

# Real Windows: the packed package, setup/doctor against the real %APPDATA%
# and home folder, and how `npx -y sentinel-ir-mcp@0.2` starts. No client apps.
# Every push runs the same checks on GitHub's Windows runners through the
# mirror (.github/workflows/windows.yml). Here the job gates releases: it runs
# on tags before `publish`, and can be started by hand on any branch.
# Node and the npm cache are kept in the GitLab cache, Defender skips the build
# and temp folders. The informational size probe runs on release tags, Node 24.
windows_compat:
  stage: test
  tags: [saas-windows-medium-amd64]
  parallel:
    matrix:
      - NODE_VERSION: ["20.20.2", "22.23.4", "24.22.1"]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  variables:
    npm_config_cache: $CI_PROJECT_DIR\.npm
    npm_config_prefer_offline: "true"
    npm_config_audit: "false"
    npm_config_fund: "false"
  cache:
    - key: node-win-$NODE_VERSION
      paths:
        - node-dist/
    - key:
        files:
          - package-lock.json
        prefix: npm-win
      paths:
        - .npm/
  script:
    - $ProgressPreference = "SilentlyContinue"
    - $sw = [Diagnostics.Stopwatch]::StartNew(); $times = [ordered]@{}
    - 'try { Add-MpPreference -ExclusionPath $env:CI_PROJECT_DIR, $env:TEMP, "$env:LOCALAPPDATA\npm-cache", C:\nodejs-ci -ErrorAction Stop } catch { Write-Host "Defender exclusions not set: $_" }'
    - New-Item -ItemType Directory -Force node-dist | Out-Null
    - $zip = "node-dist\node-v$env:NODE_VERSION-win-x64.zip"
    - if (-not (Test-Path $zip)) { Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip" -OutFile $zip }
    - Expand-Archive $zip -DestinationPath C:\nodejs-ci
    - $times["node"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - $env:Path = "C:\nodejs-ci\node-v$env:NODE_VERSION-win-x64;" + $env:Path
    - node -v
    - npm ci
    - $times["npm ci"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - node scripts/win-quote-probe.js; $quote = $LASTEXITCODE
    - $times["quote probe"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - node scripts/compat-smoke.js; $smoke = $LASTEXITCODE
    - $times["compat smoke"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - node --test --test-concurrency=4 (Get-ChildItem test\*.test.js | ForEach-Object FullName); $tests = $LASTEXITCODE
    - $times["tests"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - if ($env:CI_COMMIT_TAG -and $env:NODE_VERSION -like "24.*") { node scripts/size-probe.js }
    - $times["size probe"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - '$times.GetEnumerator() | ForEach-Object { "TIME {0}: {1} s" -f $_.Key, $_.Value }'
    - exit ($quote + $smoke + $tests)
  artifacts:
    when: always
    paths:
      - compat-*.json
