stages:
  - test
  - publish
  - verify

# Test on every supported Node line (the MCP SDK and sentinel-ir WASM parser).
unit_tests:
  stage: test
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22", "24"]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

# Release: push a protected tag vX.Y.Z matching package.json "version".
# npm trusted publishing: npm exchanges NPM_ID_TOKEN (GitLab OIDC) for a
# short-lived token, so no npm token is stored in GitLab. The trusted publisher
# on npmjs.com allows npm publish and npm dist-tag.
publish:
  stage: publish
  image: node:24
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/'
  script:
    - npm ci
    - npm test
    - test "v$(node -p 'require("./package.json").version')" = "$CI_COMMIT_TAG"
    # Publish once; a retried job only moves the tag. `setup` writes the
    # stable-<major>.<minor> tag, which npx resolves again on every start.
    - V="${CI_COMMIT_TAG#v}"
    # The npm copy of the README tags its Agensi link as coming from npm.
    - sed -i 's/utm_source=sentinel-ir-mcp-readme/utm_source=npm/g' README.md
    - if [ -z "$(npm view "sentinel-ir-mcp@$V" version 2>/dev/null)" ]; then npm publish --provenance --access public; fi
    # Never move the tag back: a retried older release leaves a newer patch on it.
    - TAG="$(node -p 'require("./src/clients").STABLE_TAG')"
    - CUR="$(npm view "sentinel-ir-mcp@$TAG" version 2>/dev/null || true)"
    - if [ -z "$CUR" ] || node -e 'process.exit(+!require("./src/doctor").olderThan(process.argv[1], process.argv[2]))' "$CUR" "$V"; then node scripts/npm-dist-tag.js "$V" "$TAG"; fi
    # The registry shows a new version and tag only after a few minutes.
    - for i in $(seq 1 30); do NOW="$(npm view "sentinel-ir-mcp@$TAG" version --prefer-online 2>/dev/null || true)"; if [ -n "$NOW" ] && node -e 'process.exit(+require("./src/doctor").olderThan(process.argv[1], process.argv[2]))' "$NOW" "$V"; then break; fi; sleep 20; done
    - echo "$TAG -> $NOW"
    - node -e 'process.exit(+require("./src/doctor").olderThan(process.argv[1], process.argv[2]))' "$NOW" "$V"

# npm adds the publish attestation up to ~10 min after the publish, and its CDN
# caches the first answer of the attestations URL for a year: an early question
# leaves npm 10 failing `npm audit signatures` for everyone behind that edge.
# So check 15 min later; a delayed job uses no CI minutes while it waits.
# Retry this job alone to check again.
verify_release:
  stage: verify
  image: node:24
  needs: [publish]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/'
      when: delayed
      start_in: 15 minutes
  script:
    - ATTEST_TIMEOUT_MS=600000 node scripts/verify-attestations.js

# Exercise the post-publish verifier whenever it changes, without publishing:
# the latest release must pass; a package that has never had provenance and an
# unpublished version must fail.
verify_attestations:
  stage: test
  image: node:24
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - changes:
        - scripts/verify-attestations.js
        - .gitlab-ci.yml
  script:
    - ATTEST_TIMEOUT_MS=120000 node scripts/verify-attestations.js "$(npm view sentinel-ir-mcp@latest version)"
    - |
      for bad in left-pad@1.3.0 0.0.0-unpublished; do
        if out=$(ATTEST_TIMEOUT_MS=0 node scripts/verify-attestations.js "$bad" 2>&1); then
          echo "verifier accepted $bad: $out"; exit 1
        fi
        echo "$out" | grep -F "missing attestation(s): https://github.com/npm/attestation/tree/main/specs/publish/v0.1, https://slsa.dev/provenance/v0.2 or https://slsa.dev/provenance/v1"
      done

# Real Windows: the packed package, setup/doctor against the real %APPDATA%
# and home folder, and how `npx -y sentinel-ir-mcp@0.2` starts. No client apps.
# Every push runs the same checks on GitHub's Windows runners through the
# mirror (.github/workflows/windows.yml). Here the job gates releases: it runs
# on tags before `publish`, and can be started by hand on any branch.
# Node and the npm cache are kept in the GitLab cache, Defender skips the build
# and temp folders. The informational size probe runs on release tags, Node 24.
windows_compat:
  stage: test
  tags: [saas-windows-medium-amd64]
  parallel:
    matrix:
      - NODE_VERSION: ["20.20.2", "22.23.4", "24.22.1"]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  variables:
    npm_config_cache: $CI_PROJECT_DIR\.npm
    npm_config_prefer_offline: "true"
    npm_config_audit: "false"
    npm_config_fund: "false"
  cache:
    - key: node-win-$NODE_VERSION
      paths:
        - node-dist/
    - key:
        files:
          - package-lock.json
        prefix: npm-win
      paths:
        - .npm/
  script:
    - $ProgressPreference = "SilentlyContinue"
    - $sw = [Diagnostics.Stopwatch]::StartNew(); $times = [ordered]@{}
    - 'try { Add-MpPreference -ExclusionPath $env:CI_PROJECT_DIR, $env:TEMP, "$env:LOCALAPPDATA\npm-cache", C:\nodejs-ci -ErrorAction Stop } catch { Write-Host "Defender exclusions not set: $_" }'
    - New-Item -ItemType Directory -Force node-dist | Out-Null
    - $zip = "node-dist\node-v$env:NODE_VERSION-win-x64.zip"
    - if (-not (Test-Path $zip)) { Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip" -OutFile $zip }
    - Expand-Archive $zip -DestinationPath C:\nodejs-ci
    - $times["node"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - $env:Path = "C:\nodejs-ci\node-v$env:NODE_VERSION-win-x64;" + $env:Path
    - node -v
    - npm ci
    - $times["npm ci"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - node scripts/win-quote-probe.js; $quote = $LASTEXITCODE
    - $times["quote probe"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - node scripts/compat-smoke.js; $smoke = $LASTEXITCODE
    - $times["compat smoke"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - node --test --test-concurrency=4 (Get-ChildItem test\*.test.js | ForEach-Object FullName); $tests = $LASTEXITCODE
    - $times["tests"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - if ($env:CI_COMMIT_TAG -and $env:NODE_VERSION -like "24.*") { node scripts/size-probe.js }
    - $times["size probe"] = [math]::Round($sw.Elapsed.TotalSeconds, 1); $sw.Restart()
    - '$times.GetEnumerator() | ForEach-Object { "TIME {0}: {1} s" -f $_.Key, $_.Value }'
    - exit ($quote + $smoke + $tests)
  artifacts:
    when: always
    paths:
      - compat-*.json
