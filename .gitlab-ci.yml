stages:
  - test
  - publish

# Test on every supported Node line (the MCP SDK and sentinel-ir WASM parser).
unit_tests:
  stage: test
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22", "24"]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

# Release: push a protected tag vX.Y.Z matching package.json "version".
# NPM_TOKEN is a masked, protected CI/CD variable; protected tags only.
publish:
  stage: publish
  image: node:24
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/'
  script:
    - npm ci
    - npm test
    - test "v$(node -p 'require("./package.json").version')" = "$CI_COMMIT_TAG"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --provenance --access public
