stages:
  - test
  - publish

# Test on every supported Node line (the MCP SDK and sentinel-ir WASM parser).
unit_tests:
  stage: test
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22", "24"]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

# Release: push a protected tag vX.Y.Z matching package.json "version".
# NPM_TOKEN is a masked, protected CI/CD variable; protected tags only.
publish:
  stage: publish
  image: node:24
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+[.][0-9]+[.][0-9]+$/'
  script:
    - npm ci
    - npm test
    - test "v$(node -p 'require("./package.json").version')" = "$CI_COMMIT_TAG"
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm publish --provenance --access public

# Real Windows: the packed package, setup/doctor against the real %APPDATA%
# and home folder, and how `npx -y sentinel-ir-mcp@0.2` starts. No client apps.
windows_compat:
  stage: test
  tags: [saas-windows-medium-amd64]
  parallel:
    matrix:
      - NODE_VERSION: ["20.20.2", "22.23.4", "24.22.1"]
  script:
    - $ProgressPreference = "SilentlyContinue"
    - Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip" -OutFile node.zip
    - Expand-Archive node.zip -DestinationPath C:\nodejs-ci
    - $env:Path = "C:\nodejs-ci\node-v$env:NODE_VERSION-win-x64;" + $env:Path
    - node -v
    - npm ci
    - node scripts/compat-smoke.js; $smoke = $LASTEXITCODE
    - node --test (Get-ChildItem test\*.test.js | ForEach-Object FullName); $tests = $LASTEXITCODE
    - exit ($smoke + $tests)
  artifacts:
    when: always
    paths:
      - compat-*.json
